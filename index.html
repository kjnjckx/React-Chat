<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --bg-0:#ffffff;--bg-1:#f8f8fa;--bg-2:#f0f0f4;--bg-3:#e4e4ec;
    --text-0:#1a1a2e;--text-1:#44445a;--text-2:#7e7c92;--text-3:#9e9cb0;
    --accent:#6d5cff;--accent-h:#8578ff;--accent-dim:rgba(109,92,255,.08);--accent-dim2:rgba(109,92,255,.16);
    --green:#16a34a;--red:#dc2626;--orange:#ea580c;
    --border:#dddde6;--r:10px;--rs:6px;
    --sidebar-w:280px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--bg-0);color:var(--text-0);height:100vh;display:flex;overflow:hidden}

  /* ══════ SIDEBAR ══════ */
  .sidebar{
    width:var(--sidebar-w);min-width:var(--sidebar-w);height:100vh;
    background:#f2f2f5;border-right:1px solid var(--border);
    display:flex;flex-direction:column;flex-shrink:0;
    transition:margin-left .3s ease;
    z-index:100;
  }
  .sidebar.collapsed{margin-left:calc(var(--sidebar-w) * -1)}
  .sidebar-hdr{
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--border);flex-shrink:0;
  }
  .sidebar-hdr h2{font-size:13px;font-weight:600;color:var(--text-0);letter-spacing:.3px}
  .sidebar-btns{display:flex;gap:4px}
  .sb-icon-btn{
    width:32px;height:32px;border-radius:var(--rs);border:1px solid var(--border);
    background:var(--bg-0);color:var(--text-2);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all .15s;
  }
  .sb-icon-btn:hover{border-color:var(--accent);color:var(--accent)}
  .sb-icon-btn svg{width:15px;height:15px}
  .sidebar-list{flex:1;overflow-y:auto;padding:8px}
  .sidebar-list::-webkit-scrollbar{width:4px}
  .sidebar-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .sidebar-item{
    padding:10px 12px;border-radius:var(--rs);cursor:pointer;
    margin-bottom:2px;transition:all .15s;position:relative;
    display:flex;flex-direction:column;gap:2px;border:1px solid transparent;
  }
  .sidebar-item:hover{background:var(--bg-2)}
  .sidebar-item.active{background:var(--accent-dim);border-color:rgba(109,92,255,.18)}
  .sidebar-item .si-title{
    font-size:12.5px;font-weight:500;color:var(--text-0);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    padding-right:24px;
  }
  .sidebar-item.active .si-title{color:var(--accent)}
  .sidebar-item .si-meta{font-size:10px;color:var(--text-3)}
  .sidebar-item .si-del{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;border-radius:4px;border:none;
    background:transparent;color:var(--text-3);cursor:pointer;
    display:none;align-items:center;justify-content:center;font-size:13px;
  }
  .sidebar-item:hover .si-del{display:flex}
  .sidebar-item .si-del:hover{background:rgba(220,38,38,.1);color:var(--red)}
  .sidebar-empty{text-align:center;padding:40px 16px;color:var(--text-3);font-size:12px;line-height:1.8}

  .hamburger{
    display:none;width:36px;height:36px;border-radius:var(--rs);
    border:1px solid var(--border);background:var(--bg-0);color:var(--text-1);
    cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;
  }
  .hamburger svg{width:18px;height:18px}

  @media(max-width:768px){
    .sidebar{position:fixed;left:0;top:0;box-shadow:4px 0 20px rgba(0,0,0,.12)}
    .sidebar.collapsed{margin-left:calc(var(--sidebar-w) * -1)}
    .hamburger{display:flex}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99}
    .sidebar-overlay.show{display:block}
  }

  /* ══════ MAIN AREA ══════ */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

  .hdr{padding:10px 20px;background:var(--bg-1);border-bottom:1px solid var(--border);flex-shrink:0}
  .hdr-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .hdr h1{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
  .hdr h1 .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .hdr h1 .badge{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;background:var(--accent-dim2);color:var(--accent);padding:2px 7px;border-radius:4px;margin-left:4px}
  .tog-btn{background:var(--bg-0);border:1px solid var(--border);color:var(--text-1);padding:5px 12px;border-radius:var(--rs);font-size:11px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:all .2s}
  .tog-btn:hover{border-color:var(--accent);color:var(--accent)}
  .tog-btn svg{width:12px;height:12px;transition:transform .3s}
  .tog-btn.open svg{transform:rotate(180deg)}
  .cfg{max-height:0;overflow:hidden;transition:max-height .35s ease,padding .35s ease;padding:0}
  .cfg.open{max-height:520px;padding:12px 0 4px}
  .cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cfg-g{display:flex;flex-direction:column;gap:3px}
  .cfg-g.fw{grid-column:1/-1}
  .cfg-l{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-3)}
  .cfg-i{background:var(--bg-0);border:1px solid var(--border);color:var(--text-0);padding:7px 10px;border-radius:var(--rs);font-size:12px;font-family:'JetBrains Mono',monospace;outline:none;width:100%;transition:border-color .2s}
  .cfg-i:focus{border-color:var(--accent)}
  .cfg-i::placeholder{color:var(--text-3)}
  .pre-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;grid-column:1/-1}
  .pre-b{background:var(--bg-0);border:1px solid var(--border);color:var(--text-1);padding:4px 11px;border-radius:14px;font-size:10px;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap}
  .pre-b:hover,.pre-b.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
  .conn{grid-column:1/-1;display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-3);margin-top:2px}
  .conn-d{width:5px;height:5px;border-radius:50%;background:var(--text-3)}
  .conn-d.ok{background:var(--green);box-shadow:0 0 5px var(--green)}
  .conn-d.er{background:var(--red);box-shadow:0 0 5px var(--red)}
  .fmt-row{grid-column:1/-1;display:flex;gap:6px;margin-top:4px}
  .fmt-label{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:11px;color:var(--text-1);background:var(--bg-0);border:1px solid var(--border);padding:5px 12px;border-radius:var(--rs)}
  .chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
  .chat::-webkit-scrollbar{width:5px}
  .chat::-webkit-scrollbar-track{background:transparent}
  .chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .msg{max-width:800px;width:100%;margin:0 auto;animation:fadeUp .3s ease-out}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .msg-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.4px;margin-bottom:5px;color:var(--text-3)}
  .msg-lbl.u{color:var(--accent)}
  .msg-b{padding:14px 18px;border-radius:var(--r);line-height:1.7;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .msg-b.u{background:var(--bg-2);border:1px solid var(--border)}
  .msg-b.a{background:var(--bg-1);border:1px solid var(--border)}
  .viz{margin-top:10px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:#fff}
  .viz-h{background:var(--bg-1);padding:7px 12px;font-size:11px;font-weight:500;color:var(--text-1);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
  .viz-h .viz-left{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
  .viz-h .viz-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .dl-btn{background:var(--bg-0);border:1px solid var(--border);color:var(--text-2);padding:3px 8px;border-radius:4px;font-size:10px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;transition:all .2s;white-space:nowrap}
  .dl-btn:hover{border-color:var(--green);color:var(--green)}
  .dl-btn:disabled{opacity:.4;cursor:wait}
  .dl-btn svg{width:11px;height:11px}
  .img-preview{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0;max-width:800px;margin:0 auto}
  .img-preview-item{position:relative;width:60px;height:60px;border-radius:var(--rs);overflow:hidden;border:1px solid var(--border)}
  .img-preview-item img{width:100%;height:100%;object-fit:cover}
  .img-preview-item .img-rm{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
  .img-btn{background:var(--bg-0);border:1px solid var(--border);color:var(--text-2);width:46px;height:46px;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .img-btn:hover{border-color:var(--accent);color:var(--accent)}
  .img-btn svg{width:16px;height:16px}
  .save-bar{display:flex;gap:5px;grid-column:1/-1;margin-top:4px}
  .save-btn{background:var(--bg-0);border:1px solid var(--border);color:var(--text-1);padding:4px 11px;border-radius:14px;font-size:10px;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:4px}
  .save-btn:hover{border-color:var(--green);color:var(--green)}
  .save-btn svg{width:11px;height:11px}
  .msg-img{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .msg-img img{max-width:200px;max-height:150px;border-radius:var(--rs);border:1px solid var(--border)}
  .vtag{padding:2px 7px;border-radius:3px;font-size:9px;font-weight:600;letter-spacing:.5px}
  .vtag.html{background:rgba(234,88,12,.1);color:var(--orange)}
  .vtag.react{background:rgba(22,163,74,.1);color:var(--green)}
  .viz-if{width:100%;border:none;background:#fff;min-height:80px;display:block;transition:height .3s}
  .ld{display:flex;align-items:center;gap:7px;padding:10px 18px;color:var(--text-3);font-size:12px}
  .ld-d{display:flex;gap:3px}
  .ld-d span{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:ldot 1.2s ease-in-out infinite}
  .ld-d span:nth-child(2){animation-delay:.2s}.ld-d span:nth-child(3){animation-delay:.4s}
  @keyframes ldot{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
  .inp-area{padding:14px 20px 18px;background:var(--bg-1);border-top:1px solid var(--border);flex-shrink:0}
  .inp-row{max-width:800px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
  .inp-row textarea{flex:1;background:var(--bg-0);border:1px solid var(--border);color:var(--text-0);padding:11px 14px;border-radius:var(--r);font-size:13.5px;font-family:inherit;resize:none;outline:none;line-height:1.5;min-height:46px;max-height:150px;transition:border-color .2s}
  .inp-row textarea:focus{border-color:var(--accent)}
  .inp-row textarea::placeholder{color:var(--text-3)}
  .btns{display:flex;gap:5px;flex-shrink:0}
  .s-btn,.c-btn{border:none;width:46px;height:46px;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .s-btn{background:var(--accent);color:#fff}
  .s-btn:hover{background:var(--accent-h)}
  .s-btn:active{transform:scale(.95)}
  .s-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
  .s-btn svg,.c-btn svg{width:16px;height:16px}
  .c-btn{background:var(--bg-0);border:1px solid var(--border);color:var(--text-2)}
  .c-btn:hover{border-color:var(--red);color:var(--red)}
  .toast{position:fixed;top:16px;right:16px;background:#fff;border:1px solid var(--red);color:var(--red);padding:10px 16px;border-radius:var(--rs);font-size:12px;z-index:999;max-width:420px;line-height:1.5;animation:fadeUp .3s ease;white-space:pre-wrap;box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .hint{max-width:800px;margin:0 auto;text-align:center;padding:50px 20px;color:var(--text-3)}
  .hint h2{font-size:18px;font-weight:400;margin-bottom:10px;color:var(--text-1)}
  .hint p{font-size:12.5px;line-height:1.8}
  .hint-ch{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:16px}
  .h-c{background:var(--bg-1);border:1px solid var(--border);color:var(--text-1);padding:7px 14px;border-radius:18px;font-size:11.5px;cursor:pointer;transition:all .2s}
  .h-c:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
</style>
</head>
<body>

<!-- SIDEBAR OVERLAY (mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-hdr">
    <h2>聊天历史</h2>
    <div class="sidebar-btns">
      <button class="sb-icon-btn" title="新建聊天" onclick="newSession()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="sb-icon-btn" title="收起侧边栏" onclick="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      </button>
    </div>
  </div>
  <div class="sidebar-list" id="sessionList"></div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="hdr">
    <div class="hdr-top">
      <div style="display:flex;align-items:center;gap:8px">
        <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
      <button class="tog-btn" id="togBtn" onclick="togCfg()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>设置
      </button>
    </div>
    <div class="cfg" id="cfgPanel">
      <div class="cfg-grid">
        <div class="cfg-g fw"><span class="cfg-l">已保存的配置</span><div style="display:flex;gap:6px"><select class="cfg-i" id="cfgSelect" onchange="loadConfig()" style="flex:1"><option value="">+ 新建配置</option></select><button class="pre-b" id="delCfgBtn" onclick="deleteConfig()" style="display:none">删除</button></div></div>
        <div class="cfg-g fw"><span class="cfg-l">配置名称</span><input class="cfg-i" id="cfgName" placeholder="例：我的 Claude API"/></div>
        <div class="cfg-g fw"><span class="cfg-l">API 端点 (Base URL)</span><input class="cfg-i" id="cfgBase" placeholder="https://api.anthropic.com" value="https://api.anthropic.com"/></div>
        <div class="cfg-g"><span class="cfg-l">API Key</span><input class="cfg-i" id="cfgKey" type="password" placeholder="sk-ant-... 或第三方 Key"/></div>
        <div class="cfg-g"><span class="cfg-l">模型名称（可自由填写）</span><input class="cfg-i" id="cfgModel" placeholder="任意模型名称" value="claude-sonnet-4-20250514"/></div>
        <div class="cfg-g fw" style="margin-top:4px">
          <span class="cfg-l">API 格式</span>
          <div class="fmt-row">
            <label class="fmt-label"><input type="radio" name="apiFmt" value="anthropic" checked onchange="saveCfg()"> Anthropic (/v1/messages)</label>
            <label class="fmt-label"><input type="radio" name="apiFmt" value="openai" onchange="saveCfg()"> OpenAI (/v1/chat/completions)</label>
          </div>
        </div>
        <div class="pre-row">
          <button class="pre-b" onclick="saveConfig()" style="background:var(--green);border-color:var(--green);color:#fff;font-weight:600">保存配置</button>
        </div>
        <div class="pre-row">
          <span class="cfg-l" style="width:100%;margin-bottom:1px">快速预设</span>
          <button class="pre-b" onclick="preset('anthropic',this)">Anthropic</button>
          <button class="pre-b" onclick="preset('openrouter',this)">OpenRouter</button>
          <button class="pre-b" onclick="preset('oneapi',this)">One API</button>
          <button class="pre-b" onclick="preset('openai-compat',this)">OpenAI 兼容</button>
        </div>
        <div class="conn" id="conn"><div class="conn-d" id="connD"></div><span id="connT">未连接</span></div>
        <div class="save-bar">
          <span class="cfg-l" style="width:100%;margin-bottom:1px">聊天记录</span>
        </div>
        <div class="save-bar">
          <button class="save-btn" onclick="exportChat()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出JSON</button>
          <button class="save-btn" onclick="document.getElementById('importFile').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>导入JSON</button>
          <input type="file" id="importFile" accept=".json" style="display:none" onchange="importChat(event)">
        </div>
      </div>
    </div>
  </div>
  <div class="chat" id="chat">
    <div class="hint" id="hint">
      <h2>React Sandbox — 兼容所有中转站</h2>
      <p>无需 Tool Use，通过标记约定实现可视化<br/>支持 HTML + React 两种模式</p>
      <div class="hint-ch">
        <div class="h-c" onclick="useH(this)">用 React 做一个待办事项应用</div>
        <div class="h-c" onclick="useH(this)">用 Recharts 画一个折线图展示数据趋势</div>
        <div class="h-c" onclick="useH(this)">做一个交互式的颜色调色板工具</div>
        <div class="h-c" onclick="useH(this)">用 Chart.js 画一个柱状图展示季度销售</div>
      </div>
    </div>
  </div>
  <div class="inp-area">
    <div class="img-preview" id="imgPreview"></div>
    <div class="inp-row">
      <textarea id="inp" rows="1" placeholder="输入消息..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}" oninput="ar(this)"></textarea>
      <input type="file" id="imgInput" accept="image/*" multiple style="display:none" onchange="handleImgUpload(event)">
      <div class="btns">
        <button class="img-btn" title="上传图片" onclick="document.getElementById('imgInput').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>
        <button class="c-btn" title="清空对话" onclick="clr()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>
        <button class="c-btn" id="webBtn" title="联网搜索" onclick="toggleWeb()" style="opacity:0.6">🔍</button>
        <button class="s-btn" id="sBtn" onclick="send()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
      </div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// SYSTEM PROMPT
// ══════════════════════════════════════════════════════
const SYSTEM_PROMPT = [
  "你是一个智能助手，擅长构建可视化内容和交互式应用。",
  "",

function handleImgUpload(e) {
  const files = Array.from(e.target.files);
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    if (file.size > 20 * 1024 * 1024) { showErr('图片不能超过 20MB'); continue; }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      pendingImages.push({ base64: dataUrl.split(',')[1], mediaType: file.type, dataUrl, name: file.name });
      renderImgPreview();
    };
    reader.readAsDataURL(file);
  }
  e.target.value = '';
}

function renderImgPreview() {
  const el = document.getElementById('imgPreview');
  if (pendingImages.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = pendingImages.map((img, i) =>
    `<div class="img-preview-item"><img src="${img.dataUrl}" alt="${esc(img.name)}"><button class="img-rm" onclick="removeImg(${i})">×</button></div>`
  ).join('');
}

function removeImg(i) { pendingImages.splice(i, 1); renderImgPreview(); }

document.addEventListener('paste', (e) => {
  const items = Array.from(e.clipboardData?.items || []);
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const file = item.getAsFile();
      if (!file) continue;
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        pendingImages.push({ base64: dataUrl.split(',')[1], mediaType: file.type, dataUrl, name: 'pasted-image' });
        renderImgPreview();
      };
      reader.readAsDataURL(file);
    }
  }
});

function getFmt() { const s = document.querySelector('input[name="apiFmt"]:checked'); return s ? s.value : 'anthropic'; }

async function callAPI(msgs, searchContext = '') {
  const key = document.getElementById('cfgKey').value.trim();
  const base = document.getElementById('cfgBase').value.trim().replace(/\/+$/, '');
  const model = document.getElementById('cfgModel').value.trim();
  if (!key) { showErr('请先输入 API Key'); return null; }
  if (!model) { showErr('请填写模型名称'); return null; }
  return getFmt() === 'openai' ? callOAI(base,key,model,msgs,searchContext) : callAnth(base,key,model,msgs,searchContext);
}

async function callAnth(base, key, model, msgs, searchContext = '') {
  const url = `${base}/v1/messages`;
  const systemText = searchContext ? SYSTEM_PROMPT + '\n\n' + searchContext : SYSTEM_PROMPT;
  const body = { model, max_tokens: 131072, system: [{ type: "text", text: systemText }], messages: msgs };
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'Authorization': `Bearer ${key}`, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify(body)
  });
  if (!r.ok) { const raw = await r.text().catch(() => ''); let msg = `API ${r.status}`; try { const j = JSON.parse(raw); msg = j.error?.message || j.message || raw.slice(0,300); } catch(e) { msg = raw.slice(0,300) || msg; } throw new Error(`[${r.status}] ${msg}`); }
  setConn(true);
  const data = await r.json();
  return data.content?.filter(b => b.type === 'text').map(b => b.text).join('\n') || '';
}

async function callOAI(base, key, model, msgs, searchContext = '') {
  const systemText = searchContext ? SYSTEM_PROMPT + '\n\n' + searchContext : SYSTEM_PROMPT;
  const oaiMsgs = [
    { role: 'system', content: systemText },
    ...msgs.map(m => {
      if (typeof m.content === 'string') return { role: m.role, content: m.content };
      if (Array.isArray(m.content)) {
        const parts = m.content.map(block => {
          if (block.type === 'text') return { type: 'text', text: block.text };
          if (block.type === 'image') return { type: 'image_url', image_url: { url: `data:${block.source.media_type};base64,${block.source.data}` } };
          return null;
        }).filter(Boolean);
        return { role: m.role, content: parts };
      }
      return { role: m.role, content: String(m.content) };
    })
  ];
  const url = `${base}/v1/chat/completions`;
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
    body: JSON.stringify({ model, max_tokens: 131072, messages: oaiMsgs })
  });
  if (!r.ok) { const raw = await r.text().catch(() => ''); let msg = `API ${r.status}`; try { const j = JSON.parse(raw); msg = j.error?.message || j.message || raw.slice(0,300); } catch(e) { msg = raw.slice(0,300) || msg; } throw new Error(`[${r.status}] ${msg}`); }
  setConn(true);
  const data = await r.json();
  return data.choices?.[0]?.message?.content || '';
}

// 解析响应
// ══════════════════════════════════════════════════════
function parseResponse(text) {
  const parts = [];
  const regex = /~~~(HTML_VIZ|REACT_VIZ)\s*\n([\s\S]*?)~~~/g;
  let last = 0, match;
  while ((match = regex.exec(text)) !== null) {
    const before = text.slice(last, match.index).trim();
    if (before) parts.push({ type: 'text', content: before });
    const vt = match[1] === 'HTML_VIZ' ? 'html' : 'react';
    const code = match[2].trim();
    if (code) parts.push({ type: vt, code });
    last = match.index + match[0].length;
  }
  const after = text.slice(last).trim();
  if (after) {
    const truncMatch = after.match(/^~~~(HTML_VIZ|REACT_VIZ)\s*\n([\s\S]+)/);
    if (truncMatch) {
      const vt = truncMatch[1] === 'HTML_VIZ' ? 'html' : 'react';
      const code = truncMatch[2].trim();
      parts.push({ type: 'text', content: '⚠️ 代码输出被截断（超出 token 上限），尝试渲染已有部分：' });
      if (code) parts.push({ type: vt, code });
    } else {
      parts.push({ type: 'text', content: after });
    }
  }
  if (parts.length === 0 && text.trim()) parts.push({ type: 'text', content: text.trim() });
  return parts;
}

async function searchWeb(query) {
  try {
    const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&max_results=5`;
    const r = await fetch(url); const data = await r.json();
    if (!data.RelatedTopics || data.RelatedTopics.length === 0) return '';
    const results = data.RelatedTopics.slice(0, 3).map(item => {
      const text = item.Text || item.Result || '';
      return text.replace(/<[^>]*>/g, '').slice(0, 150);
    }).filter(Boolean);
    return results.length > 0 ? '【最新搜索结果】\n' + results.join('\n\n') : '';
  } catch (e) { return ''; }
}

const SESSIONS_KEY = 'sb3_sessions';
const ACTIVE_SESSION_KEY = 'sb3_activeSession';
let currentSessionId = null;

function getSessions() { try { const d = localStorage.getItem(SESSIONS_KEY); return d ? JSON.parse(d) : []; } catch { return []; } }
function saveSessions(sessions) {
  try { localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions)); }
  catch (e) { if (e.name === 'QuotaExceededError') showErr('存储空间不足，请导出并删除旧会话'); }
}

function generateSessionTitle(hist) {
  if (!hist || hist.length === 0) return '新对话';
  const firstUser = hist.find(m => m.role === 'user');
  if (!firstUser) return '新对话';
  let text = '';
  if (typeof firstUser.content === 'string') text = firstUser.content;
  else if (Array.isArray(firstUser.content)) text = firstUser.content.filter(b => b.type === 'text').map(b => b.text).join(' ');
  return text.slice(0, 40) || '新对话';
}

function formatTime(ts) {
  const d = new Date(ts), diff = Date.now() - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff/60000) + ' 分钟前';
  if (diff < 86400000) return Math.floor(diff/3600000) + ' 小时前';
  if (diff < 604800000) return Math.floor(diff/86400000) + ' 天前';
  return d.toLocaleDateString('zh-CN', { month:'short', day:'numeric' });
}

function newSession() {
  saveCurrentSession();
  const session = { id: Date.now().toString(), title: '新对话', updatedAt: Date.now(), history: [] };
  const sessions = getSessions();
  sessions.unshift(session);
  saveSessions(sessions);
  currentSessionId = session.id;
  localStorage.setItem(ACTIVE_SESSION_KEY, currentSessionId);
  history = [];
  document.getElementById('chat').innerHTML = HINT_HTML;
  renderSessionList();
}

function switchSession(id) {
  if (id === currentSessionId) return;
  saveCurrentSession();
  const sessions = getSessions();
  const session = sessions.find(s => s.id === id);
  if (!session) return;
  currentSessionId = id;
  localStorage.setItem(ACTIVE_SESSION_KEY, id);
  history = session.history || [];
  replayHistory();
  renderSessionList();
  if (window.innerWidth <= 768) toggleSidebar();
}

function deleteSession(id, e) {
  e.stopPropagation();
  if (!confirm('确定删除此会话？')) return;
  let sessions = getSessions().filter(s => s.id !== id);
  saveSessions(sessions);
  if (id === currentSessionId) {
    if (sessions.length > 0) switchSession(sessions[0].id);
    else newSession();
  }
  renderSessionList();
}

function saveCurrentSession() {
  if (!currentSessionId) return;
  const sessions = getSessions();
  const idx = sessions.findIndex(s => s.id === currentSessionId);
  if (idx === -1) return;
  // Strip base64 image data to save space - keep only text content
  const compactHistory = history.map(m => {
    if (m.role === 'user' && Array.isArray(m.content)) {
      return { ...m, content: m.content.map(b => {
        if (b.type === 'image') return { type: 'image', source: { type: 'base64', media_type: b.source.media_type, data: b.source.data.slice(0, 100) + '...' } };
        return b;
      })};
    }
    return m;
  });
  sessions[idx].history = compactHistory;
  sessions[idx].title = generateSessionTitle(history);
  sessions[idx].updatedAt = Date.now();
  saveSessions(sessions);
}

function renderSessionList() {
  const el = document.getElementById('sessionList');
  const sessions = getSessions();
  if (sessions.length === 0) { el.innerHTML = '<div class="sidebar-empty">还没有聊天记录<br/>点击上方 + 开始新对话</div>'; return; }
  el.innerHTML = sessions.map(s => `
    <div class="sidebar-item ${s.id === currentSessionId ? 'active' : ''}" onclick="switchSession('${s.id}')">
      <div class="si-title">${esc(s.title)}</div>
      <div class="si-meta">${formatTime(s.updatedAt)} · ${(s.history||[]).length} 条</div>
      <button class="si-del" onclick="deleteSession('${s.id}',event)" title="删除">×</button>
    </div>
  `).join('');
}

function autoSave() {
  if (currentSessionId && history.length > 0) { saveCurrentSession(); renderSessionList(); }
}

async function send() {
  const inp = document.getElementById('inp');
  const t = inp.value.trim();
  const imgs = [...pendingImages];
  if ((!t && imgs.length === 0) || loading) return;
  const h = document.getElementById('hint'); if (h) h.remove();

  if (!currentSessionId) {
    const session = { id: Date.now().toString(), title: '新对话', updatedAt: Date.now(), history: [] };
    const sessions = getSessions(); sessions.unshift(session); saveSessions(sessions);
    currentSessionId = session.id;
    localStorage.setItem(ACTIVE_SESSION_KEY, currentSessionId);
    renderSessionList();
  }

  addU(t, imgs);
  inp.value = ''; inp.style.height = '46px';
  pendingImages = []; renderImgPreview();

  let userContent;
  if (imgs.length > 0) {
    userContent = [];
    for (const img of imgs) userContent.push({ type: 'image', source: { type: 'base64', media_type: img.mediaType, data: img.base64 } });
    if (t) userContent.push({ type: 'text', text: t });
  } else { userContent = t; }

  history.push({ role: 'user', content: userContent });
  setLd(true);

  let searchContext = '';
  if (webSearchEnabled && t) searchContext = await searchWeb(t);

  try {
    const resp = await callAPI(history, searchContext);
    if (resp !== null) {
      rmLd();
      history.push({ role: 'assistant', content: resp });
      const parts = parseResponse(resp);
      for (const p of parts) {
        if (p.type === 'text') addA(p.content);
        else if (p.type === 'html') renderHTML('可视化', p.code, 420);
        else if (p.type === 'react') renderReact('React 组件', p.code, 500);
      }
      autoSave();
    }
  } catch (e) { showErr(e.message); setConn(false); history.pop(); }
  finally { setLd(false); }
}

// ══════════════════════════════════════════════════════
// 渲染引擎
// ══════════════════════════════════════════════════════
const vizCodeStore = {};

function renderHTML(title, code, h) {
  const el = document.getElementById('chat'), d = document.createElement('div'); d.className = 'msg';
  const id = 'v' + Date.now() + Math.random().toString(36).slice(2, 5);
  vizCodeStore[id] = { type: 'html', code };
  d.innerHTML = `<div class="msg-lbl">Claude</div><div class="viz"><div class="viz-h"><div class="viz-left"><span>${esc(title)}</span></div><div class="viz-right"><button class="dl-btn" onclick="downloadCode('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>.html</button><span class="vtag html">HTML</span></div></div><iframe id="${id}" class="viz-if" style="height:${h}px"></iframe></div>`;
  el.appendChild(d);
  const ifr = document.getElementById(id);
  const blob = new Blob([code], { type: 'text/html;charset=utf-8' });
  const burl = URL.createObjectURL(blob);
  ifr.src = burl; setupH(ifr, burl); sb();
}

function renderReact(title, jsxCode, h) {
  const el = document.getElementById('chat'), d = document.createElement('div'); d.className = 'msg';
  const id = 'v' + Date.now() + Math.random().toString(36).slice(2, 5);
  vizCodeStore[id] = { type: 'react', code: jsxCode };
  d.innerHTML = `<div class="msg-lbl">Claude</div><div class="viz"><div class="viz-h"><div class="viz-left"><span>${esc(title)}</span></div><div class="viz-right"><button class="dl-btn" onclick="downloadCode('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>.jsx</button><span class="vtag react">REACT</span></div></div><iframe id="${id}" class="viz-if" style="height:${h}px"></iframe></div>`;
  el.appendChild(d);
  const ifr = document.getElementById(id);
  const html = buildReactSandboxHTML(jsxCode);
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const burl = URL.createObjectURL(blob);
  ifr.src = burl; setupH(ifr, burl); sb();
}

function downloadCode(vizId) {
  const entry = vizCodeStore[vizId]; if (!entry) { showErr('找不到源码'); return; }
  const ts = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
  const filename = entry.type === 'html' ? `visualization-${ts}.html` : `component-${ts}.jsx`;
  const blob = new Blob([entry.code], { type: entry.type === 'html' ? 'text/html;charset=utf-8' : 'text/jsx;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function setupH(ifr, burl) {
  window.addEventListener('message', (e) => {
    if (e.source === ifr.contentWindow && e.data?.type === 'sandbox-height') { const h = Math.min(e.data.height + 10, 800); if (h > 50) ifr.style.height = h + 'px'; }
  });
  ifr.onload = () => {
    if (burl) setTimeout(() => URL.revokeObjectURL(burl), 5000);
    try { const d = ifr.contentDocument; if (d) { const ch = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight); if (ch > 50) ifr.style.height = Math.min(ch + 20, 800) + 'px'; } } catch (e) {}
  };
}

// ══════════════════════════════════════════════════════
// UI helpers
// ══════════════════════════════════════════════════════
function addU(t, imgs) {
  const el = document.getElementById('chat'), d = document.createElement('div'); d.className = 'msg';
  let imgHtml = '';
  if (imgs && imgs.length > 0) imgHtml = `<div class="msg-img">${imgs.map(img => `<img src="${img.dataUrl}" alt="">`).join('')}</div>`;
  d.innerHTML = `<div class="msg-lbl u">You</div><div class="msg-b u">${t ? esc(t) : ''}${imgHtml}</div>`;
  el.appendChild(d); sb();
}
function addA(t) { const el = document.getElementById('chat'), d = document.createElement('div'); d.className = 'msg'; d.innerHTML = `<div class="msg-lbl">Claude</div><div class="msg-b a">${ft(t)}</div>`; el.appendChild(d); sb(); }
function setLd(s) { loading = s; document.getElementById('sBtn').disabled = s; if (s) showLd(); else rmLd(); }
function showLd() { rmLd(); const el = document.getElementById('chat'), d = document.createElement('div'); d.id = 'ld'; d.className = 'msg'; d.innerHTML = `<div class="msg-lbl">Claude</div><div class="ld"><div class="ld-d"><span></span><span></span><span></span></div><span>思考中...</span></div>`; el.appendChild(d); sb(); }
function rmLd() { const e = document.getElementById('ld'); if (e) e.remove(); }
function togCfg() { document.getElementById('cfgPanel').classList.toggle('open'); document.getElementById('togBtn').classList.toggle('open'); }
function preset(k, el) {
  const p = PRESETS[k]; if (!p) return;
  document.getElementById('cfgBase').value = p.base; document.getElementById('cfgModel').value = p.model;
  const r = document.querySelector(`input[name="apiFmt"][value="${p.fmt}"]`); if (r) r.checked = true;
  document.querySelectorAll('.pre-b').forEach(b => b.classList.remove('on')); el.classList.add('on'); saveCfg();
}
function saveCfg() {
  ['cfgBase', 'cfgKey', 'cfgModel'].forEach(id => localStorage.setItem('sb3_' + id, document.getElementById(id).value));
  const s = document.querySelector('input[name="apiFmt"]:checked'); if (s) localStorage.setItem('sb3_apiFmt', s.value);
}
function setConn(ok) {
  document.getElementById('connD').className = 'conn-d ' + (ok ? 'ok' : 'er');
  document.getElementById('connT').textContent = ok ? '已连接 — ' + document.getElementById('cfgModel').value : '连接失败';
}
function clr() { history = []; document.getElementById('chat').innerHTML = ''; pendingImages = []; renderImgPreview(); autoSave(); }

// ══════════════════════════════════════════════════════
// 导出/导入
// ══════════════════════════════════════════════════════
function exportChat() {
  if (history.length === 0) { showErr('当前没有聊天记录'); return; }
  const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.download = `chat-${new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-')}.json`;
  a.href = url; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function importChat(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!Array.isArray(parsed)) throw new Error('格式错误');
      newSession(); history = parsed; replayHistory(); autoSave();
      showSuccess('已导入 ' + history.length + ' 条消息');
    } catch (err) { showErr('导入失败: ' + err.message); }
  };
  reader.readAsText(file); e.target.value = '';
}

function replayHistory() {
  document.getElementById('chat').innerHTML = '';
  if (history.length === 0) { document.getElementById('chat').innerHTML = HINT_HTML; return; }
  for (const msg of history) {
    if (msg.role === 'user') {
      if (typeof msg.content === 'string') addU(msg.content, []);
      else if (Array.isArray(msg.content)) {
        const text = msg.content.filter(b => b.type === 'text').map(b => b.text).join('\n');
        const imgs = msg.content.filter(b => b.type === 'image').map(b => ({
          dataUrl: `data:${b.source.media_type};base64,${b.source.data}`, base64: b.source.data, mediaType: b.source.media_type
        }));
        addU(text, imgs);
      }
    } else if (msg.role === 'assistant') {
      const text = typeof msg.content === 'string' ? msg.content : '';
      const parts = parseResponse(text);
      for (const p of parts) {
        if (p.type === 'text') addA(p.content);
        else if (p.type === 'html') renderHTML('可视化', p.code, 420);
        else if (p.type === 'react') renderReact('React 组件', p.code, 500);
      }
    }
  }
}

function showSuccess(m) {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const d = document.createElement('div'); d.className = 'toast';
  d.style.borderColor = 'var(--green)'; d.style.color = 'var(--green)';
  d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 3000);
}
function showErr(m) { document.querySelectorAll('.toast').forEach(e => e.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 10000); }
function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function ft(t) {
  return esc(t)
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre style="background:#f4f4f8;padding:10px;border-radius:7px;overflow-x:auto;font-family:JetBrains Mono,monospace;font-size:12px;margin:6px 0;border:1px solid #dddde6;color:#1a1a2e"><code>$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code style="background:#ededf2;padding:1px 5px;border-radius:3px;font-family:JetBrains Mono,monospace;font-size:12px;color:#1a1a2e">$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}
function sb() { const c = document.getElementById('chat'); requestAnimationFrame(() => c.scrollTop = c.scrollHeight); }
function ar(e) { e.style.height = '46px'; e.style.height = Math.min(e.scrollHeight, 150) + 'px'; }
function useH(e) { document.getElementById('inp').value = e.textContent; send(); }

// ══════════════════════════════════════════════════════
// 多配置管理
// ══════════════════════════════════════════════════════
const CONFIGS_KEY = 'sb3_configs';
const CURRENT_CONFIG_KEY = 'sb3_currentConfig';

function getConfigs() { const data = localStorage.getItem(CONFIGS_KEY); return data ? JSON.parse(data) : []; }
function saveConfigs(configs) { localStorage.setItem(CONFIGS_KEY, JSON.stringify(configs)); }

function saveConfig() {
  const name = document.getElementById('cfgName').value.trim();
  if (!name) { alert('请输入配置名称'); return; }
  const cfg = { id: Date.now().toString(), name, base: document.getElementById('cfgBase').value, key: document.getElementById('cfgKey').value, model: document.getElementById('cfgModel').value, fmt: document.querySelector('input[name="apiFmt"]:checked').value };
  const configs = getConfigs(); configs.push(cfg); saveConfigs(configs);
  refreshConfigSelect(); alert('配置已保存'); document.getElementById('cfgName').value = '';
}

function loadConfig() {
  const select = document.getElementById('cfgSelect'); const id = select.value; if (!id) return;
  const configs = getConfigs(); const cfg = configs.find(c => c.id === id); if (!cfg) return;
  document.getElementById('cfgName').value = cfg.name; document.getElementById('cfgBase').value = cfg.base;
  document.getElementById('cfgKey').value = cfg.key; document.getElementById('cfgModel').value = cfg.model;
  document.querySelector(`input[name="apiFmt"][value="${cfg.fmt}"]`).checked = true;
  localStorage.setItem(CURRENT_CONFIG_KEY, id); document.getElementById('delCfgBtn').style.display = 'block'; saveCfg();
}

function deleteConfig() {
  const select = document.getElementById('cfgSelect'); const id = select.value;
  if (!id || !confirm('确定删除此配置？')) return;
  const configs = getConfigs().filter(c => c.id !== id); saveConfigs(configs);
  refreshConfigSelect(); document.getElementById('delCfgBtn').style.display = 'none'; document.getElementById('cfgName').value = '';
}

function refreshConfigSelect() {
  const select = document.getElementById('cfgSelect'); const configs = getConfigs(); const currentId = select.value;
  select.innerHTML = '<option value="">+ 新建配置</option>';
  configs.forEach(cfg => { const opt = document.createElement('option'); opt.value = cfg.id; opt.textContent = cfg.name; select.appendChild(opt); });
  if (currentId && configs.find(c => c.id === currentId)) select.value = currentId;
}

// ══════════════════════════════════════════════════════
// 初始化
// ══════════════════════════════════════════════════════
(function () {
  refreshConfigSelect();
  const lastId = localStorage.getItem(CURRENT_CONFIG_KEY);
  if (lastId) { document.getElementById('cfgSelect').value = lastId; loadConfig(); }

  ['cfgBase', 'cfgKey', 'cfgModel'].forEach(id => {
    const v = localStorage.getItem('sb3_' + id); if (v) document.getElementById(id).value = v;
    document.getElementById(id).addEventListener('input', saveCfg);
  });
  const sf = localStorage.getItem('sb3_apiFmt');
  if (sf) { const r = document.querySelector(`input[name="apiFmt"][value="${sf}"]`); if (r) r.checked = true; }
  if (webSearchEnabled) document.getElementById('webBtn').style.opacity = '1';

  // Session init
  const sessions = getSessions();
  const activeId = localStorage.getItem(ACTIVE_SESSION_KEY);
  if (sessions.length === 0) {
    newSession();
  } else if (activeId && sessions.find(s => s.id === activeId)) {
    currentSessionId = activeId;
    history = sessions.find(s => s.id === activeId).history || [];
    if (history.length > 0) replayHistory();
  } else {
    currentSessionId = sessions[0].id;
    localStorage.setItem(ACTIVE_SESSION_KEY, currentSessionId);
    history = sessions[0].history || [];
    if (history.length > 0) replayHistory();
  }
  renderSessionList();
  window.addEventListener('beforeunload', () => saveCurrentSession());
})();
</script>
