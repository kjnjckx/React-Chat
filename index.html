<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Chatbox — React Sandbox</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{--bg-0:#0b0b0f;--bg-1:#131318;--bg-2:#1b1b23;--bg-3:#25252f;--text-0:#ededf2;--text-1:#b3b1c4;--text-2:#7e7c92;--text-3:#56546a;--accent:#6d5cff;--accent-h:#8578ff;--accent-dim:rgba(109,92,255,.10);--accent-dim2:rgba(109,92,255,.22);--green:#34d399;--red:#f87171;--orange:#fb923c;--border:#2a2a36;--r:10px;--rs:6px}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--bg-0);color:var(--text-0);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .hdr{padding:10px 20px;background:var(--bg-1);border-bottom:1px solid var(--border);flex-shrink:0}
  .hdr-top{display:flex;align-items:center;justify-content:space-between}
  .hdr h1{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
  .hdr h1 .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .hdr h1 .badge{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;background:var(--accent-dim2);color:var(--accent-h);padding:2px 7px;border-radius:4px;margin-left:4px}
  .tog-btn{background:var(--bg-3);border:1px solid var(--border);color:var(--text-1);padding:5px 12px;border-radius:var(--rs);font-size:11px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:all .2s}
  .tog-btn:hover{border-color:var(--accent);color:var(--accent)}
  .tog-btn svg{width:12px;height:12px;transition:transform .3s}
  .tog-btn.open svg{transform:rotate(180deg)}
  .cfg{max-height:0;overflow:hidden;transition:max-height .35s ease,padding .35s ease;padding:0}
  .cfg.open{max-height:520px;padding:12px 0 4px}
  .cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cfg-g{display:flex;flex-direction:column;gap:3px}
  .cfg-g.fw{grid-column:1/-1}
  .cfg-l{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-3)}
  .cfg-i{background:var(--bg-2);border:1px solid var(--border);color:var(--text-0);padding:7px 10px;border-radius:var(--rs);font-size:12px;font-family:'JetBrains Mono',monospace;outline:none;width:100%;transition:border-color .2s}
  .cfg-i:focus{border-color:var(--accent)}
  .cfg-i::placeholder{color:var(--text-3)}
  .pre-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;grid-column:1/-1}
  .pre-b{background:var(--bg-2);border:1px solid var(--border);color:var(--text-1);padding:4px 11px;border-radius:14px;font-size:10px;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap}
  .pre-b:hover,.pre-b.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
  .conn{grid-column:1/-1;display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-3);margin-top:2px}
  .conn-d{width:5px;height:5px;border-radius:50%;background:var(--text-3)}
  .conn-d.ok{background:var(--green);box-shadow:0 0 5px var(--green)}
  .conn-d.er{background:var(--red);box-shadow:0 0 5px var(--red)}
  .fmt-row{grid-column:1/-1;display:flex;gap:6px;margin-top:4px}
  .fmt-label{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:11px;color:var(--text-1);background:var(--bg-2);border:1px solid var(--border);padding:5px 12px;border-radius:var(--rs)}
  .chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
  .chat::-webkit-scrollbar{width:5px}
  .chat::-webkit-scrollbar-track{background:transparent}
  .chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .msg{max-width:800px;width:100%;margin:0 auto;animation:fadeUp .3s ease-out}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .msg-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.4px;margin-bottom:5px;color:var(--text-3)}
  .msg-lbl.u{color:var(--accent)}
  .msg-b{padding:14px 18px;border-radius:var(--r);line-height:1.7;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .msg-b.u{background:var(--bg-3);border:1px solid var(--border)}
  .msg-b.a{background:var(--bg-2);border:1px solid rgba(109,92,255,.06)}
  .viz{margin-top:10px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:#fff}
  .viz-h{background:var(--bg-2);padding:7px 12px;font-size:11px;font-weight:500;color:var(--text-1);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
  .viz-h .viz-left{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
  .viz-h .viz-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .dl-btn{background:var(--bg-3);border:1px solid var(--border);color:var(--text-2);padding:3px 8px;border-radius:4px;font-size:10px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;transition:all .2s;white-space:nowrap}
  .dl-btn:hover{border-color:var(--green);color:var(--green)}
  .dl-btn:disabled{opacity:.4;cursor:wait}
  .dl-btn svg{width:11px;height:11px}
  .img-preview{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0;max-width:800px;margin:0 auto}
  .img-preview-item{position:relative;width:60px;height:60px;border-radius:var(--rs);overflow:hidden;border:1px solid var(--border)}
  .img-preview-item img{width:100%;height:100%;object-fit:cover}
  .img-preview-item .img-rm{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
  .img-btn{background:var(--bg-3);border:1px solid var(--border);color:var(--text-3);width:46px;height:46px;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .img-btn:hover{border-color:var(--accent);color:var(--accent)}
  .img-btn svg{width:16px;height:16px}
  .save-bar{display:flex;gap:5px;grid-column:1/-1;margin-top:4px}
  .save-btn{background:var(--bg-2);border:1px solid var(--border);color:var(--text-1);padding:4px 11px;border-radius:14px;font-size:10px;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:4px}
  .save-btn:hover{border-color:var(--green);color:var(--green)}
  .save-btn svg{width:11px;height:11px}
  .msg-img{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .msg-img img{max-width:200px;max-height:150px;border-radius:var(--rs);border:1px solid var(--border)}
  .vtag{padding:2px 7px;border-radius:3px;font-size:9px;font-weight:600;letter-spacing:.5px}
  .vtag.html{background:rgba(251,146,60,.12);color:var(--orange)}
  .vtag.react{background:rgba(52,211,153,.12);color:var(--green)}
  .viz-if{width:100%;border:none;background:#fff;min-height:80px;display:block;transition:height .3s}
  .ld{display:flex;align-items:center;gap:7px;padding:10px 18px;color:var(--text-3);font-size:12px}
  .ld-d{display:flex;gap:3px}
  .ld-d span{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:ldot 1.2s ease-in-out infinite}
  .ld-d span:nth-child(2){animation-delay:.2s}.ld-d span:nth-child(3){animation-delay:.4s}
  @keyframes ldot{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
  .inp-area{padding:14px 20px 18px;background:var(--bg-1);border-top:1px solid var(--border);flex-shrink:0}
  .inp-row{max-width:800px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
  .inp-row textarea{flex:1;background:var(--bg-2);border:1px solid var(--border);color:var(--text-0);padding:11px 14px;border-radius:var(--r);font-size:13.5px;font-family:inherit;resize:none;outline:none;line-height:1.5;min-height:46px;max-height:150px;transition:border-color .2s}
  .inp-row textarea:focus{border-color:var(--accent)}
  .inp-row textarea::placeholder{color:var(--text-3)}
  .btns{display:flex;gap:5px;flex-shrink:0}
  .s-btn,.c-btn{border:none;width:46px;height:46px;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .s-btn{background:var(--accent);color:#fff}
  .s-btn:hover{background:var(--accent-h)}
  .s-btn:active{transform:scale(.95)}
  .s-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
  .s-btn svg,.c-btn svg{width:16px;height:16px}
  .c-btn{background:var(--bg-3);border:1px solid var(--border);color:var(--text-3)}
  .c-btn:hover{border-color:var(--red);color:var(--red)}
  .toast{position:fixed;top:16px;right:16px;background:#2a1a1a;border:1px solid var(--red);color:var(--red);padding:10px 16px;border-radius:var(--rs);font-size:12px;z-index:999;max-width:420px;line-height:1.5;animation:fadeUp .3s ease;white-space:pre-wrap}
  .hint{max-width:800px;margin:0 auto;text-align:center;padding:50px 20px;color:var(--text-3)}
  .hint h2{font-size:18px;font-weight:400;margin-bottom:10px;color:var(--text-1)}
  .hint p{font-size:12.5px;line-height:1.8}
  .hint-ch{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:16px}
  .h-c{background:var(--bg-2);border:1px solid var(--border);color:var(--text-1);padding:7px 14px;border-radius:18px;font-size:11.5px;cursor:pointer;transition:all .2s}
  .h-c:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-top">
    <h1><span class="dot"></span>Claude Chatbox<span class="badge">React Sandbox</span></h1>
    <button class="tog-btn" id="togBtn" onclick="togCfg()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>设置
    </button>
  </div>
  <div class="cfg" id="cfgPanel">
    <div class="cfg-grid">
      <div class="cfg-g fw"><span class="cfg-l">API 端点 (Base URL)</span><input class="cfg-i" id="cfgBase" placeholder="https://api.anthropic.com" value="https://api.anthropic.com"/></div>
      <div class="cfg-g"><span class="cfg-l">API Key</span><input class="cfg-i" id="cfgKey" type="password" placeholder="sk-ant-... 或第三方 Key"/></div>
      <div class="cfg-g"><span class="cfg-l">模型名称（可自由填写）</span><input class="cfg-i" id="cfgModel" placeholder="任意模型名称" value="claude-sonnet-4-20250514"/></div>
      <div class="cfg-g fw" style="margin-top:4px">
        <span class="cfg-l">API 格式</span>
        <div class="fmt-row">
          <label class="fmt-label"><input type="radio" name="apiFmt" value="anthropic" checked onchange="saveCfg()"> Anthropic (/v1/messages)</label>
          <label class="fmt-label"><input type="radio" name="apiFmt" value="openai" onchange="saveCfg()"> OpenAI (/v1/chat/completions)</label>
        </div>
      </div>
      <div class="pre-row">
        <span class="cfg-l" style="width:100%;margin-bottom:1px">快速预设</span>
        <button class="pre-b" onclick="preset('anthropic',this)">Anthropic</button>
        <button class="pre-b" onclick="preset('openrouter',this)">OpenRouter</button>
        <button class="pre-b" onclick="preset('oneapi',this)">One API</button>
        <button class="pre-b" onclick="preset('openai-compat',this)">OpenAI 兼容</button>
      </div>
      <div class="conn" id="conn"><div class="conn-d" id="connD"></div><span id="connT">未连接</span></div>
      <div class="save-bar">
        <span class="cfg-l" style="width:100%;margin-bottom:1px">聊天记录</span>
      </div>
      <div class="save-bar">
        <button class="save-btn" onclick="saveChat()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>保存到浏览器</button>
        <button class="save-btn" onclick="loadChat()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 105.64-12.36L1 10"/></svg>恢复记录</button>
        <button class="save-btn" onclick="exportChat()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出JSON</button>
        <button class="save-btn" onclick="document.getElementById('importFile').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>导入JSON</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importChat(event)">
      </div>
    </div>
  </div>
</div>
<div class="chat" id="chat">
  <div class="hint" id="hint">
    <h2>React Sandbox — 兼容所有中转站</h2>
    <p>无需 Tool Use，通过标记约定实现可视化<br/>支持 HTML + React 两种模式</p>
    <div class="hint-ch">
      <div class="h-c" onclick="useH(this)">用 React 做一个待办事项应用</div>
      <div class="h-c" onclick="useH(this)">用 Recharts 画一个折线图展示数据趋势</div>
      <div class="h-c" onclick="useH(this)">做一个交互式的颜色调色板工具</div>
      <div class="h-c" onclick="useH(this)">用 Chart.js 画一个柱状图展示季度销售</div>
    </div>
  </div>
</div>
<div class="inp-area">
  <div class="img-preview" id="imgPreview"></div>
  <div class="inp-row">
    <textarea id="inp" rows="1" placeholder="输入消息..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}" oninput="ar(this)"></textarea>
    <input type="file" id="imgInput" accept="image/*" multiple style="display:none" onchange="handleImgUpload(event)">
    <div class="btns">
      <button class="img-btn" title="上传图片" onclick="document.getElementById('imgInput').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>
      <button class="c-btn" title="清空对话" onclick="clr()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>
      <button class="s-btn" id="sBtn" onclick="send()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// SYSTEM PROMPT — 标记约定，不用 Tool Use
// ══════════════════════════════════════════════════════
const SYSTEM_PROMPT = [
  "你是一个智能助手，擅长构建可视化内容和交互式应用。",
  "",
  "当用户需要任何可视化内容时（图表、交互组件、计算器、游戏、动画等），在回复中使用特殊标记嵌入代码：",
  "",
  "## 模式一：HTML 模式",
  "用 ~~~HTML_VIZ 和 ~~~ 包裹完整 HTML。适合 Chart.js、Canvas、D3 等。",
  "",
  "格式：",
  "~~~HTML_VIZ",
  "<!DOCTYPE html>",
  "<html><head><script src=\"https://cdn.jsdelivr.net/npm/chart.js\"><\\/script></head>",
  "<body><canvas id=\"c\"></canvas><script>/* 你的代码 */<\\/script></body></html>",
  "~~~",
  "",
  "## 模式二：React 模式",
  "用 ~~~REACT_VIZ 和 ~~~ 包裹 JSX。环境已预装 React 18、Recharts、Tailwind CSS。",
  "",
  "格式：",
  "~~~REACT_VIZ",
  "import { useState } from 'react';",
  "import { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer } from 'recharts';",
  "",
  "export default function App() {",
  "  return <div className=\"p-4\">...</div>;",
  "}",
  "~~~",
  "",
  "## 规则：",
  "1. HTML 模式：完整自包含 HTML 文件",
  "2. React 模式：必须 export default 导出函数组件",
  "3. React 可用：所有 Hooks、Recharts、Tailwind CSS",
  "4. 图标用 emoji 或内联 SVG，不要导入图标库",
  "5. 不要用 localStorage/sessionStorage",
  "6. ~~~HTML_VIZ 和 ~~~REACT_VIZ 标记必须独占一行",
  "7. 结束标记 ~~~ 也必须独占一行",
  "8. 标记外可以写正常解释文字",
  "",
  "选择：图表→Recharts或Chart.js，交互应用→React，3D/Canvas→HTML，普通问答→不用标记",
  "",
  "## 重要：防止输出截断",
  "如果代码较长，务必确保结尾的 ~~~ 闭合标记能被输出。宁可精简代码也不要让输出被截断。",
  "复杂组件可以拆分多个小组件在同一个文件内，减少冗余代码。",
  "",
  "重要：保持代码精简！避免生成超长代码。如果需要展示复杂内容，简化数据和逻辑，确保完整输出。"
].join("\n");


// ══════════════════════════════════════════════════════
// REACT SANDBOX 模板
// ══════════════════════════════════════════════════════
function buildReactSandboxHTML(jsxCode) {
  var encoded = JSON.stringify(jsxCode);
  return [
    '<!DOCTYPE html><html><head><meta charset="UTF-8">',
    '<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet">',
    '<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff}#root{width:100%;min-height:100px}.sandbox-error{padding:20px;color:#dc2626;font-size:13px;font-family:monospace;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;margin:12px;white-space:pre-wrap}.sandbox-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:#6b7280;font-size:13px}.spinner{width:18px;height:18px;border:2px solid #e5e7eb;border-top-color:#6d5cff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>',
    '</head><body><div id="root"><div class="sandbox-loading"><div class="spinner"></div><span>加载依赖库...</span></div></div>',
    '<script>',
    'var S=[',
    '{u:"https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js",r:1,n:"React",a:function(){window.React=React}},',
    '{u:"https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js",r:1,n:"ReactDOM",a:function(){window.ReactDOM=ReactDOM}},',
    '{u:"https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js",r:1,n:"Babel"},',
    '{u:"https://cdn.jsdelivr.net/npm/prop-types@15/prop-types.min.js",r:0,n:"PropTypes",a:function(){window.PropTypes=PropTypes}},',
    '{u:"https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js",r:0,n:"Recharts"}',
    '];var lc=0;',
    'function L(i){if(i>=S.length){R();return}var o=S[i],s=document.createElement("script");s.src=o.u;',
    's.onload=function(){lc++;if(o.a)try{o.a()}catch(e){}var sp=document.querySelector(".sandbox-loading span");if(sp)sp.textContent=o.n+" ✓ ("+lc+"/"+S.length+")";L(i+1)};',
    's.onerror=function(){if(o.r){document.getElementById("root").innerHTML="<div class=sandbox-error>加载失败："+o.n+"</div>";rh()}else L(i+1)};',
    'document.head.appendChild(s)}',

// ══════════════════════════════════════════════════════
// API 调用 — 不带 tools，system 用数组格式
// ══════════════════════════════════════════════════════
const PRESETS = {
  'anthropic':     { base:'https://api.anthropic.com',   model:'claude-sonnet-4-20250514', fmt:'anthropic' },
  'openrouter':    { base:'https://openrouter.ai/api',   model:'anthropic/claude-sonnet-4', fmt:'anthropic' },
  'oneapi':        { base:'https://your-domain.com',     model:'claude-sonnet-4-20250514', fmt:'anthropic' },
  'openai-compat': { base:'https://api.openai.com',      model:'gpt-4o',                   fmt:'openai' },
};
let history = [], loading = false;
let pendingImages = []; // { base64, mediaType, dataUrl }

// ══════════════════════════════════════════════════════
// 图片上传处理
// ══════════════════════════════════════════════════════
function handleImgUpload(e) {
  const files = Array.from(e.target.files);
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    if (file.size > 20 * 1024 * 1024) { showErr('图片不能超过 20MB'); continue; }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const base64 = dataUrl.split(',')[1];
      const mediaType = file.type;
      pendingImages.push({ base64, mediaType, dataUrl, name: file.name });
      renderImgPreview();
    };
    reader.readAsDataURL(file);
  }
  e.target.value = ''; // reset
}

function renderImgPreview() {
  const el = document.getElementById('imgPreview');
  if (pendingImages.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = pendingImages.map((img, i) =>
    `<div class="img-preview-item"><img src="${img.dataUrl}" alt="${esc(img.name)}"><button class="img-rm" onclick="removeImg(${i})">×</button></div>`
  ).join('');
}

function removeImg(i) {
  pendingImages.splice(i, 1);
  renderImgPreview();
}

// 粘贴图片 (Ctrl+V)
document.addEventListener('paste', (e) => {
  const items = Array.from(e.clipboardData?.items || []);
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const file = item.getAsFile();
      if (!file) continue;
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        pendingImages.push({ base64: dataUrl.split(',')[1], mediaType: file.type, dataUrl, name: 'pasted-image' });
        renderImgPreview();
      };
      reader.readAsDataURL(file);
    }
  }
});

function getFmt() {
  const s = document.querySelector('input[name="apiFmt"]:checked');
  return s ? s.value : 'anthropic';
}

async function callAPI(msgs) {
  const key = document.getElementById('cfgKey').value.trim();
  const base = document.getElementById('cfgBase').value.trim().replace(/\/+$/, '');
  const model = document.getElementById('cfgModel').value.trim();
  if (!key) { showErr('请先输入 API Key'); return null; }
  if (!model) { showErr('请填写模型名称'); return null; }
  return getFmt() === 'openai' ? callOAI(base,key,model,msgs) : callAnth(base,key,model,msgs);
}

async function callAnth(base, key, model, msgs) {
  const url = `${base}/v1/messages`;
  const body = {
    model,
    max_tokens: 131072,
    // ★ 关键修复：system 用数组格式，兼容所有中转站
    system: [{ type: "text", text: SYSTEM_PROMPT }],
    messages: msgs
  };
  console.log('[Anthropic] POST', url);

  const r = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'Authorization': `Bearer ${key}`,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify(body)
  });

  if (!r.ok) {
    const raw = await r.text().catch(() => '');
    console.error('[Anthropic] Error:', raw);
    let msg = `API ${r.status}`;
    try { const j = JSON.parse(raw); msg = j.error?.message || j.message || raw.slice(0,300); } catch(e) { msg = raw.slice(0,300) || msg; }
    throw new Error(`[${r.status}] ${msg}`);
  }
  setConn(true);
  const data = await r.json();
  return data.content?.filter(b => b.type === 'text').map(b => b.text).join('\n') || '';
}

async function callOAI(base, key, model, msgs) {
  // 转换消息格式：Anthropic 图片格式 → OpenAI 格式
  const oaiMsgs = [
    { role: 'system', content: SYSTEM_PROMPT },
    ...msgs.map(m => {
      if (typeof m.content === 'string') return { role: m.role, content: m.content };
      // 多模态消息转换
      if (Array.isArray(m.content)) {
        const parts = m.content.map(block => {
          if (block.type === 'text') return { type: 'text', text: block.text };
          if (block.type === 'image') {
            return {
              type: 'image_url',
              image_url: { url: `data:${block.source.media_type};base64,${block.source.data}` }
            };
          }
          return null;
        }).filter(Boolean);
        return { role: m.role, content: parts };
      }
      return { role: m.role, content: String(m.content) };
    })
  ];
  const url = `${base}/v1/chat/completions`;
  console.log('[OpenAI] POST', url);

  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
    body: JSON.stringify({ model, max_tokens: 131072, messages: oaiMsgs })
  });

  if (!r.ok) {
    const raw = await r.text().catch(() => '');
    console.error('[OpenAI] Error:', raw);
    let msg = `API ${r.status}`;
    try { const j = JSON.parse(raw); msg = j.error?.message || j.message || raw.slice(0,300); } catch(e) { msg = raw.slice(0,300) || msg; }
    throw new Error(`[${r.status}] ${msg}`);
  }
  setConn(true);
  const data = await r.json();
  return data.choices?.[0]?.message?.content || '';
}


// ══════════════════════════════════════════════════════
// 解析响应 — 提取 ~~~HTML_VIZ / ~~~REACT_VIZ 标记
// ══════════════════════════════════════════════════════
function parseResponse(text) {
  const parts = [];
  // 匹配完整的标记对
  const regex = /~~~(HTML_VIZ|REACT_VIZ)\s*\n([\s\S]*?)~~~/g;
  let last = 0, match;
  while ((match = regex.exec(text)) !== null) {
    const before = text.slice(last, match.index).trim();
    if (before) parts.push({ type: 'text', content: before });
    const vt = match[1] === 'HTML_VIZ' ? 'html' : 'react';
    const code = match[2].trim();
    if (code) parts.push({ type: vt, code });
    last = match.index + match[0].length;
  }
  const after = text.slice(last).trim();

  // ★ 容错：如果剩余文本以 ~~~REACT_VIZ 或 ~~~HTML_VIZ 开头但没有结束标记
  //   说明回复被截断了，仍然尝试提取代码
  if (after) {
    const truncMatch = after.match(/^~~~(HTML_VIZ|REACT_VIZ)\s*\n([\s\S]+)/);
    if (truncMatch) {
      const vt = truncMatch[1] === 'HTML_VIZ' ? 'html' : 'react';
      const code = truncMatch[2].trim();
      parts.push({ type: 'text', content: '⚠️ 代码输出被截断（超出 token 上限），尝试渲染已有部分：' });
      if (code) parts.push({ type: vt, code });
    } else {
      parts.push({ type: 'text', content: after });
    }
  }

  if (parts.length === 0 && text.trim()) parts.push({ type: 'text', content: text.trim() });
  return parts;
}


// ══════════════════════════════════════════════════════
// 发送 & 渲染
// ══════════════════════════════════════════════════════
async function send() {
  const inp = document.getElementById('inp');
  const t = inp.value.trim();
  const imgs = [...pendingImages];
  if ((!t && imgs.length === 0) || loading) return;
  const h = document.getElementById('hint'); if (h) h.remove();

  // 显示用户消息（含图片）
  addU(t, imgs);
  inp.value = ''; inp.style.height = '46px';
  pendingImages = [];
  renderImgPreview();

  // 构建消息内容：纯文本或多模态
  let userContent;
  if (imgs.length > 0) {
    userContent = [];
    for (const img of imgs) {
      userContent.push({
        type: 'image',
        source: { type: 'base64', media_type: img.mediaType, data: img.base64 }
      });
    }
    if (t) userContent.push({ type: 'text', text: t });
  } else {
    userContent = t;
  }

  history.push({ role: 'user', content: userContent });
  setLd(true);
  try {
    const resp = await callAPI(history);
    if (resp !== null) {
      rmLd();
      history.push({ role: 'assistant', content: resp });
      const parts = parseResponse(resp);
      for (const p of parts) {
        if (p.type === 'text') addA(p.content);
        else if (p.type === 'html') renderHTML('可视化', p.code, 420);
        else if (p.type === 'react') renderReact('React 组件', p.code, 500);
      }
    }
  } catch (e) { showErr(e.message); setConn(false); history.pop(); }
  finally { setLd(false); }
}

const vizCodeStore = {}; // id → { type, code }

// ── 下载源码文件 ──
function downloadCode(vizId) {
  const entry = vizCodeStore[vizId];
  if (!entry) { showErr('找不到源码'); return; }

  const ts = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
  let filename, content, mimeType;

  if (entry.type === 'html') {
    filename = `visualization-${ts}.html`;
    content = entry.code;
    mimeType = 'text/html;charset=utf-8';
  } else {
    // React: 下载 .jsx 源码
    filename = `component-${ts}.jsx`;
    content = entry.code;
    mimeType = 'text/jsx;charset=utf-8';
  }

  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function setupH(ifr, burl) {
  window.addEventListener('message', (e) => {
    if (e.source === ifr.contentWindow && e.data?.type === 'sandbox-height') {
      const h = Math.min(e.data.height + 10, 800);
      if (h > 50) ifr.style.height = h + 'px';
    }
  });
  ifr.onload = () => {
    if (burl) setTimeout(() => URL.revokeObjectURL(burl), 5000);
    try { const d = ifr.contentDocument; if (d) { const ch = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight); if (ch > 50) ifr.style.height = Math.min(ch + 20, 800) + 'px'; } } catch (e) {}
  };
}


// ══════════════════════════════════════════════════════
// UI
// ══════════════════════════════════════════════════════
function addU(t, imgs) {
  const el = document.getElementById('chat'), d = document.createElement('div'); d.className = 'msg';
  let imgHtml = '';
  if (imgs && imgs.length > 0) {
    imgHtml = `<div class="msg-img">${imgs.map(img => `<img src="${img.dataUrl}" alt="">`).join('')}</div>`;
  }
  d.innerHTML = `<div class="msg-lbl u">You</div><div class="msg-b u">${t ? esc(t) : ''}${imgHtml}</div>`;
  el.appendChild(d); sb();
}
function addA(t) { const el = document.getElementById('chat'), d = document.createElement('div'); d.className = 'msg'; d.innerHTML = `<div class="msg-lbl">Claude</div><div class="msg-b a">${ft(t)}</div>`; el.appendChild(d); sb(); }
function setLd(s) { loading = s; document.getElementById('sBtn').disabled = s; if (s) showLd(); else rmLd(); }
function showLd() { rmLd(); const el = document.getElementById('chat'), d = document.createElement('div'); d.id = 'ld'; d.className = 'msg'; d.innerHTML = `<div class="msg-lbl">Claude</div><div class="ld"><div class="ld-d"><span></span><span></span><span></span></div><span>思考中...</span></div>`; el.appendChild(d); sb(); }
function rmLd() { const e = document.getElementById('ld'); if (e) e.remove(); }
function togCfg() { document.getElementById('cfgPanel').classList.toggle('open'); document.getElementById('togBtn').classList.toggle('open'); }
function preset(k, el) {
  const p = PRESETS[k]; if (!p) return;
  document.getElementById('cfgBase').value = p.base;
  document.getElementById('cfgModel').value = p.model;
  const r = document.querySelector(`input[name="apiFmt"][value="${p.fmt}"]`);
  if (r) r.checked = true;
  document.querySelectorAll('.pre-b').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  saveCfg();
}
function saveCfg() {
  ['cfgBase', 'cfgKey', 'cfgModel'].forEach(id => localStorage.setItem('sb3_' + id, document.getElementById(id).value));
  const s = document.querySelector('input[name="apiFmt"]:checked');
  if (s) localStorage.setItem('sb3_apiFmt', s.value);
}
function setConn(ok) {
  document.getElementById('connD').className = 'conn-d ' + (ok ? 'ok' : 'er');
  document.getElementById('connT').textContent = ok ? '已连接 — ' + document.getElementById('cfgModel').value : '连接失败';
}
function clr() { history = []; document.getElementById('chat').innerHTML = ''; pendingImages = []; renderImgPreview(); }

// ══════════════════════════════════════════════════════
// 聊天记录 保存/恢复/导出/导入
// ══════════════════════════════════════════════════════
function saveChat() {
  if (history.length === 0) { showErr('当前没有聊天记录'); return; }
  try {
    localStorage.setItem('sb3_chatHistory', JSON.stringify(history));
    showSuccess('已保存到浏览器（' + history.length + ' 条消息）');
  } catch (e) {
    if (e.name === 'QuotaExceededError') {
      showErr('存储空间不足（可能图片太多），请使用「导出JSON」保存');
    } else { showErr('保存失败: ' + e.message); }
  }
}

function loadChat() {
  const saved = localStorage.getItem('sb3_chatHistory');
  if (!saved) { showErr('没有找到已保存的记录'); return; }
  try {
    const parsed = JSON.parse(saved);
    if (!Array.isArray(parsed) || parsed.length === 0) { showErr('记录为空'); return; }
    history = parsed;
    replayHistory();
    showSuccess('已恢复 ' + history.length + ' 条消息');
  } catch (e) { showErr('恢复失败: ' + e.message); }
}

function exportChat() {
  if (history.length === 0) { showErr('当前没有聊天记录'); return; }
  const data = JSON.stringify(history, null, 2);
  const blob = new Blob([data], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
  a.download = `chat-${ts}.json`;
  a.href = url;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importChat(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!Array.isArray(parsed)) throw new Error('格式错误');
      history = parsed;
      replayHistory();
      showSuccess('已导入 ' + history.length + ' 条消息');
    } catch (err) { showErr('导入失败: ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// 重新渲染历史记录到界面
function replayHistory() {
  document.getElementById('chat').innerHTML = '';
  const hint = document.getElementById('hint'); if (hint) hint.remove();
  for (const msg of history) {
    if (msg.role === 'user') {
      // 提取文本和图片
      if (typeof msg.content === 'string') {
        addU(msg.content, []);
      } else if (Array.isArray(msg.content)) {
        const text = msg.content.filter(b => b.type === 'text').map(b => b.text).join('\n');
        const imgs = msg.content.filter(b => b.type === 'image').map(b => ({
          dataUrl: `data:${b.source.media_type};base64,${b.source.data}`,
          base64: b.source.data,
          mediaType: b.source.media_type
        }));
        addU(text, imgs);
      }
    } else if (msg.role === 'assistant') {
      const text = typeof msg.content === 'string' ? msg.content : '';
      const parts = parseResponse(text);
      for (const p of parts) {
        if (p.type === 'text') addA(p.content);
        else if (p.type === 'html') renderHTML('可视化', p.code, 420);
        else if (p.type === 'react') renderReact('React 组件', p.code, 500);
      }
    }
  }
}

function showSuccess(m) {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const d = document.createElement('div'); d.className = 'toast';
  d.style.borderColor = 'var(--green)'; d.style.color = 'var(--green)';
  d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 3000);
}
function showErr(m) { document.querySelectorAll('.toast').forEach(e => e.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 10000); }
function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function ft(t) {
  return esc(t)
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre style="background:#13131a;padding:10px;border-radius:7px;overflow-x:auto;font-family:JetBrains Mono,monospace;font-size:12px;margin:6px 0;border:1px solid #2a2a36"><code>$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code style="background:#25252f;padding:1px 5px;border-radius:3px;font-family:JetBrains Mono,monospace;font-size:12px">$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}
function sb() { const c = document.getElementById('chat'); requestAnimationFrame(() => c.scrollTop = c.scrollHeight); }
function ar(e) { e.style.height = '46px'; e.style.height = Math.min(e.scrollHeight, 150) + 'px'; }
function useH(e) { document.getElementById('inp').value = e.textContent; send(); }

// 配置持久化
(function () {
  ['cfgBase', 'cfgKey', 'cfgModel'].forEach(id => {
    const v = localStorage.getItem('sb3_' + id); if (v) document.getElementById(id).value = v;
    document.getElementById(id).addEventListener('input', saveCfg);
  });
  const sf = localStorage.getItem('sb3_apiFmt');
  if (sf) { const r = document.querySelector(`input[name="apiFmt"][value="${sf}"]`); if (r) r.checked = true; }
})();
</script>
